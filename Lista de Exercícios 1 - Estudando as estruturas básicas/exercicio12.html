<body>
    <script>
        let numero = parseInt(prompt("Insira um número tabuada:"));

for (let i = 1; i <= 10; i++) {
    let resultado = numero * i;
    console.log(numero + " x " + i + " = " + resultado);
}

    </script>
</body>
