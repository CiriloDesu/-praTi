<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let peso = parseFloat(prompt("Insira o peso em kg: ")); 
let altura = parseFloat(prompt("Insira a altura em metros: "));

let imc = peso / (altura * altura);

console.log("Seu IMC é: " + imc.toFixed(2));

if (imc < 18.5) {
    console.log("Abaixo do peso");
} else if (imc >= 18.5 && imc < 24.9) {
    console.log("Peso normal");
} else if (imc >= 25 && imc < 29.9) {
    console.log("Sobrepeso");
}
else {
    console.log("Obesidade");
}

/*IMC (kg/m²)
Classificação
< 18,5
Abaixo do peso
18,5 - 24,9
Peso normal
25 - 29,9
Sobrepeso
30 - 34,9
Obesidade grau I e superior*/
    </script>
</body>
</html>
